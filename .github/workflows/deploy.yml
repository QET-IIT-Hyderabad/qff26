name: Deploy
on:
  push: { branches: [main] }
  pull_request: {}
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: deployment
        uses: actions/deploy-pages@v4   # deploy-pages only runs on main; PRs get the preview URL in the Checks tab
